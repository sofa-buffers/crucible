# Crucible fuzzed message — the "full scale" message (Phase 3).
#
# This is the family's full-scale example (mirrors arena's schema/message.sofab.yaml
# and the c-cpp fuzzer's full_scale_example): every scalar width, fp32/fp64, a
# string, a blob, eight numeric arrays, nested fp arrays, an array of strings, an
# array of blobs, an array of structs, a boolean, and two enums and two bitfields
# (scalars, compact arrays, a struct child and a wrapper-element field each).
# It exercises far more of the wire format than the Phase-1 `probe`.
#
# The message is intentionally still keyed `probe` so the generated type name
# (Probe / probe / message_probe_t) is stable and the drivers — which are
# schema-agnostic under the round-trip canonical form (oracle/canonical.md) — need
# no changes when the schema scales. Field ids are the wire ids.
version: 1
$defs:
  enum:
    # MESSAGE_SPEC §1: an enum is bounded by its DECLARED WIDTH, the smallest SIGNED
    # type holding every constant. Non-contiguous, a negative constant and a 0 constant:
    # i8, so -128..127 is valid (50 names no constant) and 128 is INVALID. MIN and MAX
    # sit ON the i8 edges, so a width derivation that is off by one (picks i16 for 127,
    # or rejects -128) shows up in the width vectors instead of hiding inside the type.
    Level: { MIN: -128, LOW: -3, OFF: 0, ON: 1, MAX: 127 }
    # -1000 and 300 force i16 (-32768..32767). NO 0 constant, so every field of this
    # type MUST declare a default naming a constant (§1, "A field's default must still
    # name a constant"): `default: 7`. A received 0 is then a valid, in-width, unnamed
    # value that differs from the default, and must be written back.
    Code: { NEG: -1000, TWO: 2, SEVEN: 7, BIG: 300 }
  bitfield:
    # §1: bounded by the smallest UNSIGNED type holding the highest declared pos, not by
    # the mask the flags form. Positions 0/1/3 -> u8 (0..255); bit 2 is undeclared and
    # valid; 256 is INVALID.
    Perm: { R: { pos: 0 }, W: { pos: 1 }, X: { pos: 3 } }
    # Highest pos 31 -> u32 (0..2^32-1). Pos 31 is also where the TypeScript backend
    # carries a bitfield as a bigint, so that carrier is exercised.
    Wide: { LO: { pos: 0 }, MID: { pos: 9 }, HI: { pos: 31 } }
messages:
  probe:
    summary: |
      The full-scale fuzzed message: all scalar widths, floats, string, blob,
      numeric arrays, a nested struct, a struct of arrays, and an array of strings.
    payload:
      u8:  { id: 0, type: u8 }
      i8:  { id: 1, type: i8 }
      u16: { id: 2, type: u16 }
      i16: { id: 3, type: i16 }
      u32: { id: 4, type: u32 }
      i32: { id: 5, type: i32 }
      u64: { id: 6, type: u64 }
      i64: { id: 7, type: i64 }

      nested:
        id: 10
        type: struct
        fields:
          f32:         { id: 0, type: fp32 }
          f64:         { id: 1, type: fp64 }
          str:         { id: 2, type: string, maxlen: 32 }
          bytes_field: { id: 3, type: blob,   maxlen: 4 }
          # A `boolean` inside a struct scope. Child id 9 deliberately: id 4 is the
          # "unknown id inside nested" every framing sweep places (sweep_framing.py).
          flag:        { id: 9, type: boolean }
          # an enum and a bitfield as struct children (crucible#211)
          level:       { id: 10, type: enum, enum: { $ref: "#/$defs/enum/Level" } }
          mask:        { id: 11, type: bitfield, bits: { $ref: "#/$defs/bitfield/Wide" } }

      arrays:
        id: 100
        type: struct
        fields:
          u8:  { id: 0, type: array, items: { type: u8,  count: 5 } }
          i8:  { id: 1, type: array, items: { type: i8,  count: 5 } }
          u16: { id: 2, type: array, items: { type: u16, count: 5 } }
          i16: { id: 3, type: array, items: { type: i16, count: 5 } }
          u32: { id: 4, type: array, items: { type: u32, count: 5 } }
          i32: { id: 5, type: array, items: { type: i32, count: 5 } }
          u64: { id: 6, type: array, items: { type: u64, count: 5 } }
          i64: { id: 7, type: array, items: { type: i64, count: 5 } }
          nested:
            id: 10
            type: struct
            fields:
              fp32: { id: 0, type: array, items: { type: fp32, count: 5 } }
              fp64: { id: 1, type: array, items: { type: fp64, count: 5 } }

      string_array:
        id: 200
        type: array
        items: { type: string, count: 5, maxlen: 64 }

      # blob analogue of string_array (id 200): the index-keyed wrapper whose heap
      # container (_BlobSeq) has the same unguarded shape as the string-array path
      # F-0013 hardened. `probe` had no blob array, so the over-index / over-maxlen
      # blob-element paths were untested (F-0013 residual, docs/TODO.md).
      blob_array:
        id: 201
        type: array
        items: { type: blob, count: 5, maxlen: 64 }

      # WP-05: the `array of struct{k,v}` (the map pattern) — the one wrapper whose
      # elements are themselves sequences, so it is where the §2/§5.1 sequence-element
      # rules (an all-default *element* stays framed at an interior position, the
      # trailing run elides, the all-default array omits the wrapper) become testable.
      # Was held out behind F-0030 / corelib-c-cpp#109 (the C object encoder framed
      # all N elements); folded in on the POC omit-all-default-sequences family, where
      # the fix (`_field_is_default`-driven elision) is in.
      struct_array:
        id: 202
        type: array
        items:
          type: struct
          count: 5
          fields:
            k: { id: 0, type: u32 }
            v: { id: 1, type: string, maxlen: 16 }
            # the fourth boolean position: inside a wrapper *element* sequence
            f: { id: 2, type: boolean }
            # a non-zero enum default inside a wrapper ELEMENT: an interior all-default
            # element is an id gap (§5.1) and must come back with code = 7, not 0
            code: { id: 3, type: enum, enum: { $ref: "#/$defs/enum/Code" }, default: 7 }
            perm: { id: 4, type: bitfield, bits: { $ref: "#/$defs/bitfield/Perm" } }

      # CORELIB_PLAN §4.4 — `boolean` has no wire type of its own: it is an unsigned
      # integer, **canonical on encode** (`true` -> 1) and **tolerant on decode**
      # (EVERY non-zero value reads as true, is normalized away, and re-encodes as 1;
      # it is never INVALID). It is also the one integer-backed leaf type that carries
      # **no width bound** (MESSAGE_SPEC §1) — where `u8 = 256` is INVALID under §7.1,
      # `boolean = 256` is a legal spelling of `true`.
      #
      # Both halves were unreachable here until 2026-09-18: `probe` declared no
      # boolean, so no vector in any corpus could carry one and the whole rule was
      # untestable family-wide (AUDIT_v3: ten ports carry an open finding for the
      # missing dedicated boolean read, `corelib-cpp` has neither half).
      #
      # Ids 203/204 continue the append pattern of 200/201/202 and are chosen so no
      # existing vector changes meaning: 50/51 are the sweeps' unknown ids, and the
      # highest id any corpus file uses as a *declared* field is 202.
      flag: { id: 203, type: boolean }

      flag_array:
        id: 204
        type: array
        items: { type: boolean, count: 5 }

      # crucible#211 (2026-10-14): enum and bitfield, each bounded by its declared width
      # (MESSAGE_SPEC §1, §7, §7.1). Ids 205-212 continue the append pattern of 200..204;
      # no committed corpus file uses any of them, nested child ids 10/11 or element
      # field ids 3/4.
      level:       { id: 205, type: enum, enum: { $ref: "#/$defs/enum/Level" } }
      code:        { id: 206, type: enum, enum: { $ref: "#/$defs/enum/Code" }, default: 7 }
      perm:        { id: 207, type: bitfield, bits: { $ref: "#/$defs/bitfield/Perm" } }
      mask:        { id: 208, type: bitfield, bits: { $ref: "#/$defs/bitfield/Wide" } }
      # §3: an array of enum is a compact SIGNED array, of bitfield a compact UNSIGNED
      # array; each element is bounded like the scalar.
      level_array: { id: 209, type: array, items: { type: enum, enum: { $ref: "#/$defs/enum/Level" }, count: 5 } }
      code_array:  { id: 210, type: array, items: { type: enum, enum: { $ref: "#/$defs/enum/Code" }, count: 5 } }
      perm_array:  { id: 211, type: array, items: { type: bitfield, bits: { $ref: "#/$defs/bitfield/Perm" }, count: 5 } }
      mask_array:  { id: 212, type: array, items: { type: bitfield, bits: { $ref: "#/$defs/bitfield/Wide" }, count: 5 } }
