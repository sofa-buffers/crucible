# form: an enum field whose body is $ref to a $defs enum, with a site default
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  enum:
    Hue: { R: 0, G: 1, B: 2 }
messages:
  probe:
    payload:
      c: { id: 1, type: enum, enum: { $ref: '#/$defs/enum/Hue' }, default: 1 }
---
version: 1
messages:
  probe:
    payload:
      c: { id: 1, type: enum, enum: { R: 0, G: 1, B: 2 }, default: 1 }
