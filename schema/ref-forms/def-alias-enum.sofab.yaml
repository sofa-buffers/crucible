# form: an enum def that is only a $ref to another enum def
# sofabgen builds the alias from the raw def map, which holds only the `$ref` key: one constant
# named `$ref` = 0 (G-0051). Go refuses its own output; the others generate it, and the field
# takes the width of that one constant (i8), so a declared constant outside it (BIG = 1000) is
# INVALID through the alias and valid written out.
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  enum:
    Hue:  { R: 0, G: 1, BIG: 1000 }
    HueA: { $ref: '#/$defs/enum/Hue' }
messages:
  probe:
    payload:
      c: { id: 1, type: enum, enum: { $ref: '#/$defs/enum/HueA' }, default: 1 }
---
version: 1
messages:
  probe:
    payload:
      c: { id: 1, type: enum, enum: { R: 0, G: 1, BIG: 1000 }, default: 1 }
