# form: a $defs union whose string option declares a non-empty default
# MESSAGE_SPEC §4.2: a string/blob/array option takes no non-empty default — in a $defs union too.
# expect: reject default
version: 1
$defs:
  union:
    Tiny: { a: { id: 0, type: u8 }, s: { id: 1, type: string, maxlen: 4, default: "x" } }
messages:
  probe:
    payload:
      u: { id: 1, type: union, oneof: { $ref: '#/$defs/union/Tiny' } }
