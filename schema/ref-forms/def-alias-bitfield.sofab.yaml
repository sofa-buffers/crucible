# form: a bitfield def that is only a $ref to another bitfield def
# As def-alias-enum: one flag named `$ref` (G-0051); flag pos 9 makes the width u16, not u8.
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  bitfield:
    Mode:  { r: { pos: 0 }, w: { pos: 1, default: true }, hi: { pos: 9 } }
    ModeA: { $ref: '#/$defs/bitfield/Mode' }
messages:
  probe:
    payload:
      f: { id: 1, type: bitfield, bits: { $ref: '#/$defs/bitfield/ModeA' } }
---
version: 1
messages:
  probe:
    payload:
      f: { id: 1, type: bitfield, bits: { r: { pos: 0 }, w: { pos: 1, default: true }, hi: { pos: 9 } } }
