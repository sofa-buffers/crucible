# form: the whole payload is $ref to a $defs struct
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  struct:
    Body:
      tag: { id: 0, type: u8 }
      pt:  { id: 1, type: struct, fields: { x: { id: 0, type: i32, default: 7 } } }
messages:
  probe:
    payload: { $ref: '#/$defs/struct/Body' }
---
version: 1
messages:
  probe:
    payload:
      tag: { id: 0, type: u8 }
      pt:  { id: 1, type: struct, fields: { x: { id: 0, type: i32, default: 7 } } }
