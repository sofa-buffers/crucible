# form: a union def that is only a $ref to another union def
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  union:
    Tiny:  { a: { id: 0, type: u8 }, b: { id: 1, type: u32, default: 4 } }
    TinyA: { $ref: '#/$defs/union/Tiny' }
messages:
  probe:
    payload:
      u: { id: 1, type: union, default_id: 1, oneof: { $ref: '#/$defs/union/TinyA' } }
---
version: 1
messages:
  probe:
    payload:
      u: { id: 1, type: union, default_id: 1, oneof: { a: { id: 0, type: u8 }, b: { id: 1, type: u32, default: 4 } } }
