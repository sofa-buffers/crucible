# form: a whole-field copy of a union field whose body is itself a $ref (default_id travels along)
# Holder itself is used as no type; a target that emits every $defs type emits it anyway.
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  union:
    Tiny: { a: { id: 0, type: u8 }, b: { id: 1, type: u32, default: 4 } }
  struct:
    Holder: { u: { id: 3, type: union, default_id: 1, oneof: { $ref: '#/$defs/union/Tiny' } } }
messages:
  probe:
    payload:
      tag: { id: 0, type: u8 }
      u:   { $ref: '#/$defs/struct/Holder/u' }
---
version: 1
messages:
  probe:
    payload:
      tag: { id: 0, type: u8 }
      u:   { id: 3, type: union, default_id: 1, oneof: { a: { id: 0, type: u8 }, b: { id: 1, type: u32, default: 4 } } }
