# form: a union field whose oneof is $ref to a $defs union (one site, explicit default_id)
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  union:
    Shape:
      num:  { id: 0, type: u16, default: 5 }
      name: { id: 1, type: string, maxlen: 4 }
      pt:   { id: 2, type: struct, fields: { x: { id: 0, type: i32, default: 7 } } }
messages:
  probe:
    payload:
      u: { id: 1, type: union, default_id: 1, oneof: { $ref: '#/$defs/union/Shape' } }
---
version: 1
messages:
  probe:
    payload:
      u: { id: 1, type: union, default_id: 1, oneof: { num: { id: 0, type: u16, default: 5 }, name: { id: 1, type: string, maxlen: 4 }, pt: { id: 2, type: struct, fields: { x: { id: 0, type: i32, default: 7 } } } } }
