# form: a struct field whose body is $ref to a $defs struct (one site)
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  struct:
    Vec2: { x: { id: 0, type: i32, default: 7 }, y: { id: 1, type: i32 } }
messages:
  probe:
    payload:
      tag: { id: 0, type: u8 }
      a:   { id: 1, type: struct, fields: { $ref: '#/$defs/struct/Vec2' } }
---
version: 1
messages:
  probe:
    payload:
      tag: { id: 0, type: u8 }
      a:   { id: 1, type: struct, fields: { x: { id: 0, type: i32, default: 7 }, y: { id: 1, type: i32 } } }
