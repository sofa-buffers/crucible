          f: { id: 2, type: bitfield, bits: { r: { pos: 0 }, w: { pos: 1, default: true }, x: { pos: 2 } } }
          m: { id: 3, type: union, default_id: 1, oneof: { a: { id: 0, type: u8 }, b: { id: 1, type: u32, default: 4 } } }
