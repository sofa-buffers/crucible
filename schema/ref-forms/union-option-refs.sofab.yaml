# form: an inline union whose options are $ref'd struct / enum / bitfield / union bodies
# expect: equivalent
#
# Document 1 uses $ref; document 2 is the same message with every $ref written out.
version: 1
$defs:
  struct:
    Vec2: { x: { id: 0, type: i32, default: 7 }, y: { id: 1, type: i32 } }
  enum:
    Hue: { R: 0, G: 1, B: 2 }
  bitfield:
    Mode: { r: { pos: 0 }, w: { pos: 1, default: true }, x: { pos: 2 } }
  union:
    Tiny: { a: { id: 0, type: u8 }, b: { id: 1, type: u32, default: 4 } }
messages:
  probe:
    payload:
      opt:
        id: 1
        type: union
        default_id: 1
        oneof:
          p: { id: 0, type: struct, fields: { $ref: '#/$defs/struct/Vec2' } }
          c: { id: 1, type: enum, enum: { $ref: '#/$defs/enum/Hue' }, default: 2 }
          f: { id: 2, type: bitfield, bits: { $ref: '#/$defs/bitfield/Mode' } }
          m: { id: 3, type: union, default_id: 1, oneof: { $ref: '#/$defs/union/Tiny' } }
