# form: two $defs structs referring to each other (A -> B -> A) through arrays
# A $ref cycle: no recursive types. sofabgen refuses every cycle (`circular $ref`), deliberately
# (a recursive value member has no finite size on heap-less targets, encode could loop, and
# all generated code would recurse). MESSAGE_SPEC §5.4 still says "may" — documentation#101
# makes it forbid them (G-0049, by design for the generator).
# expect: reject circular $ref
version: 1
$defs:
  struct:
    A: { v: { id: 0, type: u8 }, bs: { id: 1, type: array, items: { type: struct, fields: { $ref: '#/$defs/struct/B' } } } }
    B: { w: { id: 0, type: u8 }, as: { id: 1, type: array, items: { type: struct, fields: { $ref: '#/$defs/struct/A' } } } }
messages:
  probe:
    payload:
      a: { id: 1, type: struct, fields: { $ref: '#/$defs/struct/A' } }
