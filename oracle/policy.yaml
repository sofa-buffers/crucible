# Allowed-divergence policy.
#
# Differential testing needs a definition of which divergences are BUGS vs
# LEGAL. This file encodes that. Every rule should eventually cite a clause in
# documentation/MESSAGE_SPEC.md, or record that none exists yet (a spec hole to
# file upstream). See docs/PLAN.md §8.
#
# Phase 1 starts permissive and tightens as the spec firms up.

version: 0

# How the comparator treats a mismatch on each axis:
#   hard  -> a divergence here fails the run (a finding)
#   soft  -> reported as a warning, does not fail the run
comparison:
  # Disagreement on the three-valued verdict A(COMPLETE) / I(INCOMPLETE) /
  # R(INVALID) between implementations (MESSAGE_SPEC §7). This is the core interop
  # bug and is always hard — including an impl that collapses INCOMPLETE into
  # accept (A) or reject (R) instead of emitting I.
  verdict: hard

  # On mutual ACCEPT, the decoded canonical value must match.
  accept_value: hard

  # On mutual INCOMPLETE, whether the partial re-encoded value must match. **Stays soft**,
  # and unlike its two neighbours it is not legacy: measured 2026-08-16, it fires 5471
  # times (5463 over corpus/interesting, 8 over regression) and every single one is the
  # same thing — java hands back what it had already read when the stream ended mid-field,
  # where the other fourteen hand back nothing. The verdict is unanimous (`I` everywhere);
  # only the payload differs. Hardening this would mean 5471 red lines for one known,
  # catalogued behaviour. The I verdict itself is hard (above).
  incomplete_value: soft

  # On mutual REJECT, whether the reject *class* must match. **HARD since 2026-08-16.**
  # It was soft because the per-language error taxonomies were not aligned — that was
  # true in Phase 1 and is not true now. Measured before flipping it: across
  # corpus/interesting (17870 inputs), regression, structured, conformance, seeds and
  # limit mode, this axis fires **zero** times. Every implementation names the same class
  # for the same bytes, and the classes themselves are defined in oracle/canonical.md:16.
  # Left soft it protected nothing and would have hidden the first real disagreement:
  # the same bytes cannot be broken for two different reasons, so one side would be wrong.
  reject_class: hard

  # On mutual LIMIT_EXCEEDED (limit mode only), whether the optional class must
  # match. **HARD since 2026-08-16**, measured the same way as reject_class: zero
  # occurrences, including in limit mode itself where the axis is the whole point. The L
  # verdict itself was always hard (via `verdict` above): in limit mode every driver is
  # generated with identical max_dyn_* caps, so they must agree on L vs A/I/R.
  limit_class: hard

# ENFORCED since 2026-08-16 — `oracle/comparator.py` reads this block.
#
# An entry names an input and the one axis on which that input may differ. When the
# comparator sees a difference on that axis for that input, it prints
# `[allowed] <input> (<axis>) <id>` and does NOT fail the run. Everything else about the
# input is still compared as usual, so an entry legalises one known difference, not the
# input.
#
# MATCHING IS BY THE INPUT'S BYTES, never by the path written in `applies_to`. The path
# is how a reader finds it; the content is what is matched. That matters because the
# natural thing to do with a legal divergence is to put it into a gate corpus — which
# renames it — and a path-bound allowance would silently stop applying at exactly that
# moment. A path that no longer exists is reported on stderr rather than ignored: a
# stale allowance legalises nothing and hides that it was meant to.
#
# Specific inputs where divergence is explicitly tolerated, each with a reason
# and (eventually) a spec citation.
#
#   - id: <stable name>
#     applies_to: [<input hash or corpus file>]
#     axis: verdict | accept_value | reject_class
#     reason: <why this divergence is legal>
#     spec: <MESSAGE_SPEC.md clause, or "UNSPECIFIED — file upstream">
allow:
  # DORMANT — cannot fire on the current schemas, recorded so the first hit is
  # recognized as legal instead of filed as a finding. CORELIB_PLAN §6 (POC
  # `omit-all-default-sequences`): a heap-free profile MAY bound its lazy
  # sequence-header hold-back to a fixed depth and frame *eagerly* beyond it —
  # emitting the empty frame §2 would have omitted. That output is well-formed and
  # value-identical (the non-canonical form every decoder accepts and normalizes),
  # but not canonical, so a schema nesting all-default sequences deeper than the
  # bound splits the family's re-encode bytes: corelib-c-cpp gates it at
  # SOFAB_LAZY_SEQ_DEPTH (default 8, sofab.hpp) and corelib-rs-no-std bounds its
  # pending run likewise; the heap profiles MUST hold back to MAX_DEPTH. `probe`
  # nests 3 deep, so today every driver is canonical at full depth and this entry
  # matches nothing. If a deeper schema lands, scope `applies_to` to its corpus
  # and split the roster by documented bound (the profile MUST document it — §6).
  - id: bounded-lazy-seq-depth-noncanonical-frames
    applies_to: []          # dormant — no corpus reaches depth > 8 (see reason)
    axis: accept_value
    reason: >-
      A fixed-capacity profile with a documented lazy-hold-back bound emits
      non-canonical (but well-formed, value-identical) empty frames for all-default
      sequences nested deeper than its bound, where full-depth profiles omit them.
      Divergent bytes, same value — legal per the constrained-profile allowance.
    spec: >-
      CORELIB_PLAN §6.0.1 "Lazy framing" is the mechanism (an implementation that
      can allocate MUST hold back to full MAX_DEPTH; a heap-free profile MAY bound
      the pending run and frame eagerly beyond it); §6.2.2 "What a profile may vary"
      is the allowance and the duty — this is the "hold-back depth below MAX_DEPTH"
      row, severity byte divergence, and the profile's README MUST state the bound
      it chose (§9.7). MESSAGE_SPEC §2 requires every decoder to accept and
      normalize the resulting non-canonical frames. Re-verified 2026-09-23 at
      documentation main@c5cb2d86 — unchanged since the 2026-08-17 dd2866b reading.

  - id: c-embedded-nul-string-projection
    applies_to: [findings/F-0018-c-embedded-nul-string-truncation/embedded_nul.bin]  # probe, nested.str = "A\0B" (41 00 42)
    axis: accept_value
    reason: >-
      A `string` containing an embedded U+0000 is valid on the wire (length-delimited)
      and preserved by the 10 length-carrying profiles, but a profile that stores strings
      NUL-terminated — the C object API: `char[]` + `strlen` on re-encode — can only
      represent it up to the first NUL, so `c` and `cpp-c-cpp` re-encode `A\0B` -> `A`.
      The corelib receives and stores the full bytes correctly (istream fills the buffer +
      terminator; the strict-UTF-8 check validates all bytes); the projection to first-NUL
      is inherent to the C-string convenience, not a decode loss. The lossless path is the
      byte/length (visitor) API. By design, not a bug — see findings/F-0018.
    spec: >-
      MESSAGE_SPEC §8 + CORELIB_PLAN §6.4 "Embedded U+0000 is allowed" — re-verified
      2026-09-23 at documentation main@c5cb2d86, unchanged since the 2026-08-17
      dd2866b reading. The note this entry once proposed was
      adopted, but deliberately as a NON-NORMATIVE interop note: NUL is valid UTF-8 and a
      validator MUST NOT reject it, the corelib API is length-delimited, and
      "NUL-terminated consumers truncate at the first NUL — producers targeting such
      consumers SHOULD avoid embedded NUL or use blob". So the projection is acknowledged
      as a consumer property with the burden placed on the producer, and it is not going
      to become a normative allowance. Note also that §8's "MUST NOT mutate, truncate, or
      empty" is scoped to an INVALID-UTF-8 string; `A\0B` is valid UTF-8, so that
      prohibition does not reach this case. The entry therefore stands as a by-design
      divergence, not as a pending spec question.

# PLAN §8 is now RESOLVED. The open question was: is decoding of truncated input
# specified (one correct outcome) or undefined? MESSAGE_SPEC §7 (finish-less
# three-valued decode) settles it: truncated input is INCOMPLETE — a distinct,
# non-error verdict (line "I"), neither accept (A) nor reject (R). So verdict stays
# hard and F-0001's 7-accept/5-reject split is a genuine bug on both sides: the
# target is every impl emitting I. Genuinely malformed bytes remain INVALID (R).
notes:
  truncated_input: SPECIFIED as INCOMPLETE — MESSAGE_SPEC §7; verifies F-0001
  malformed_input: >-
    INVALID — CORELIB_PLAN §5.2.2 is the single, referenced-never-restated list (not
    MESSAGE_SPEC §7, which only names the outcome). Re-verified 2026-09-23 at
    documentation main@c5cb2d86. Its ten conditions: a varint longer than 10 bytes or
    with a payload bit at position >=64 (§4.1.3); an id/length/count above its format
    ceiling (§6.2); a reserved fixlen subtype 0x4-0x7 (§4.6); an fp32/fp64 fixlen whose
    declared length is not exactly 4/8 (§4.6); a fixlen ARRAY whose fixlen_word subtype
    is not fp32/fp64 (§4.8, §4.8.1 — crucible#173, no axis emits this yet); nesting past
    MAX_DEPTH (§4.9); a sequence-end marker with no open sequence (§4.9); an element
    count above the declared schema count (MESSAGE_SPEC §7.1); an invalid-UTF-8 string
    payload that IS READ with the strict check on (§6.4); and, on a reduced profile
    only, a field whose wire type that build does not carry (§6.2.2 type loss —
    crucible#176, dormant on the current roster, which builds no reduced profile).
    Two conditions are deliberately NOT on this list, and never fold into
    malformed_input: a non-minimal varint (§4.1.2, normalized away, not an error) and a
    receiver-cap rejection (§6.2.1 — its own LimitExceeded category, see limit_exceeded
    below).
  limit_exceeded: >-
    A configured receiver-side decode cap (max_dyn_array_count / max_dyn_string_len /
    max_dyn_blob_len, generator#102) on a schema-UNBOUNDED field. This is a POLICY
    rejection, a category distinct from INVALID: the bytes are well-formed and decode
    under a looser/unset cap. Surfaced as the `L` verdict (limit mode only). SPEC
    BASIS: NORMATIVE since CORELIB_PLAN §6.2.1 "Receiver-side technical limits" —
    re-verified 2026-09-23 at documentation main@c5cb2d86, unchanged since the
    2026-08-17 dd2866b reading. It names these three caps,
    calls them configuration rather than schema, states that exceeding one MUST NOT be
    reported as InvalidMessage nor folded into the INVALID outcome, forbids applying
    them to a field the schema already bounds, and gives the condition its own error
    code `LimitExceeded` (§6.3). The clause also settles the roster question directly:
    two receivers with DIFFERENT limits reaching different outcomes is not an interop
    failure, and conformance testing therefore compares implementations configured
    identically — which is what limit mode does. This note previously read "SPEC HOLE
    to file upstream"; the hole is closed.
    Two clauses added since: (1) §6.2.1 "a skipped field is never capped" — a
    max_dyn_* limit MUST NOT be applied to a field the decoder skips per MESSAGE_SPEC
    §7.3, so a decode that steps over an over-cap field it never reads stays COMPLETE,
    not LimitExceeded. (2) §6.3 gives InvalidArgument a third, distinct meaning
    alongside InvalidMessage and LimitExceeded: a destination too short for the value
    handed to it (§6.6.3), told apart from a schema-bound violation (InvalidMessage)
    and a receiver-cap rejection (LimitExceeded) on every aggregate surface — see
    oracle/canonical.md's `argument` class (crucible#175).
