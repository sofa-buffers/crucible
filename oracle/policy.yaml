# Allowed-divergence policy.
#
# Differential testing needs a definition of which divergences are BUGS vs
# LEGAL. This file encodes that. Every rule should eventually cite a clause in
# documentation/MESSAGE_SPEC.md, or record that none exists yet (a spec hole to
# file upstream). See docs/PLAN.md §8.
#
# Phase 1 starts permissive and tightens as the spec firms up.

version: 0

# How the comparator treats a mismatch on each axis:
#   hard  -> a divergence here fails the run (a finding)
#   soft  -> reported as a warning, does not fail the run
comparison:
  # Disagreement on the three-valued verdict A(COMPLETE) / I(INCOMPLETE) /
  # R(INVALID) between implementations (MESSAGE_SPEC §7). This is the core interop
  # bug and is always hard — including an impl that collapses INCOMPLETE into
  # accept (A) or reject (R) instead of emitting I.
  verdict: hard

  # On mutual ACCEPT, the decoded canonical value must match.
  accept_value: hard

  # On mutual INCOMPLETE, whether the partial re-encoded value must match. Soft in
  # Phase 2: partial-value materialization on a truncated stream is not aligned
  # across languages yet (same rationale as reject_class). The I verdict itself is
  # hard (above); only the payload comparison is soft.
  incomplete_value: soft

  # On mutual REJECT, whether the reject *class* must match. Soft in Phase 1:
  # the per-language error taxonomies are not aligned yet, so two impls
  # rejecting the same bytes for nominally different reasons is not (yet) a bug.
  # Tighten to `hard` once the taxonomy in canonical.md is enforced everywhere.
  reject_class: soft

  # On mutual LIMIT_EXCEEDED (limit mode only), whether the optional class must
  # match. Soft for the same reason as reject_class. The L verdict itself is hard
  # (via `verdict` above): in limit mode every driver is generated with identical
  # max_dyn_* caps, so they must agree on L vs A/I/R. See oracle/canonical.md.
  limit_class: soft

# ENFORCED since 2026-08-16 — `oracle/comparator.py` reads this block.
#
# An entry names an input and the one axis on which that input may differ. When the
# comparator sees a difference on that axis for that input, it prints
# `[allowed] <input> (<axis>) <id>` and does NOT fail the run. Everything else about the
# input is still compared as usual, so an entry legalises one known difference, not the
# input.
#
# MATCHING IS BY THE INPUT'S BYTES, never by the path written in `applies_to`. The path
# is how a reader finds it; the content is what is matched. That matters because the
# natural thing to do with a legal divergence is to put it into a gate corpus — which
# renames it — and a path-bound allowance would silently stop applying at exactly that
# moment. A path that no longer exists is reported on stderr rather than ignored: a
# stale allowance legalises nothing and hides that it was meant to.
#
# Specific inputs where divergence is explicitly tolerated, each with a reason
# and (eventually) a spec citation.
#
#   - id: <stable name>
#     applies_to: [<input hash or corpus file>]
#     axis: verdict | accept_value | reject_class
#     reason: <why this divergence is legal>
#     spec: <MESSAGE_SPEC.md clause, or "UNSPECIFIED — file upstream">
allow:
  # DORMANT — cannot fire on the current schemas, recorded so the first hit is
  # recognized as legal instead of filed as a finding. CORELIB_PLAN §6 (POC
  # `omit-all-default-sequences`): a heap-free profile MAY bound its lazy
  # sequence-header hold-back to a fixed depth and frame *eagerly* beyond it —
  # emitting the empty frame §2 would have omitted. That output is well-formed and
  # value-identical (the non-canonical form every decoder accepts and normalizes),
  # but not canonical, so a schema nesting all-default sequences deeper than the
  # bound splits the family's re-encode bytes: corelib-c-cpp gates it at
  # SOFAB_LAZY_SEQ_DEPTH (default 8, sofab.hpp) and corelib-rs-no-std bounds its
  # pending run likewise; the heap profiles MUST hold back to MAX_DEPTH. `probe`
  # nests 3 deep, so today every driver is canonical at full depth and this entry
  # matches nothing. If a deeper schema lands, scope `applies_to` to its corpus
  # and split the roster by documented bound (the profile MUST document it — §6).
  - id: bounded-lazy-seq-depth-noncanonical-frames
    applies_to: []          # dormant — no corpus reaches depth > 8 (see reason)
    axis: accept_value
    reason: >-
      A fixed-capacity profile with a documented lazy-hold-back bound emits
      non-canonical (but well-formed, value-identical) empty frames for all-default
      sequences nested deeper than its bound, where full-depth profiles omit them.
      Divergent bytes, same value — legal per the constrained-profile allowance.
    spec: >-
      CORELIB_PLAN §6 "How deep the hold-back reaches (normative)" (POC
      omit-all-default-sequences branch) — the FIXLEN_MAX/ARRAY_MAX-style
      constrained-profile allowance; MESSAGE_SPEC §2 requires every decoder to
      accept and normalize the resulting frames.

  - id: c-embedded-nul-string-projection
    applies_to: [findings/F-0018-c-embedded-nul-string-truncation/embedded_nul.bin]  # probe, nested.str = "A\0B" (41 00 42)
    axis: accept_value
    reason: >-
      A `string` containing an embedded U+0000 is valid on the wire (length-delimited)
      and preserved by the 10 length-carrying profiles, but a profile that stores strings
      NUL-terminated — the C object API: `char[]` + `strlen` on re-encode — can only
      represent it up to the first NUL, so `c` and `cpp-c-cpp` re-encode `A\0B` -> `A`.
      The corelib receives and stores the full bytes correctly (istream fills the buffer +
      terminator; the strict-UTF-8 check validates all bytes); the projection to first-NUL
      is inherent to the C-string convenience, not a decode loss. The lossless path is the
      byte/length (visitor) API. By design, not a bug — see findings/F-0018.
    spec: >-
      MESSAGE_SPEC §8 — preservation of an embedded U+0000 across decode/encode is
      implementation-defined for a NUL-terminated-string (constrained/C) profile. Proposed
      one-line normative note; until adopted, treated as the §6.4-style profile allowance.

# PLAN §8 is now RESOLVED. The open question was: is decoding of truncated input
# specified (one correct outcome) or undefined? MESSAGE_SPEC §7 (finish-less
# three-valued decode) settles it: truncated input is INCOMPLETE — a distinct,
# non-error verdict (line "I"), neither accept (A) nor reject (R). So verdict stays
# hard and F-0001's 7-accept/5-reject split is a genuine bug on both sides: the
# target is every impl emitting I. Genuinely malformed bytes remain INVALID (R).
notes:
  truncated_input: SPECIFIED as INCOMPLETE — MESSAGE_SPEC §7; verifies F-0001
  malformed_input: INVALID — MESSAGE_SPEC §7 (unknown wire-type, >64-bit varint,
    count/length over max, MAX_DEPTH, stray sequence-end)
  limit_exceeded: >-
    A configured receiver-side decode cap (max_dyn_array_count / max_dyn_string_len /
    max_dyn_blob_len, generator#102) on a schema-UNBOUNDED field. This is a POLICY
    rejection, a category distinct from INVALID: the bytes are well-formed and decode
    under a looser/unset cap. Surfaced as the `L` verdict (limit mode only). SPEC
    BASIS: analogue of the MAX_DEPTH stack bound (MESSAGE_SPEC §5.4); the heap-limit
    note is not yet in MESSAGE_SPEC — SPEC HOLE to file upstream (tracked via
    generator#102). Differing *configured* caps across impls are NOT a divergence;
    limit mode avoids that by generating the whole roster with identical caps.
