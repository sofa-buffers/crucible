# Fast, blocking regression gate — runs on every push and PR.
#
# Bootstraps the corelibs + sofabgen at the branch under test, builds all 12 replay
# drivers, and runs the GREEN oracles: the seed differential, the resolved-findings
# regression corpus, the cross-encode / structured-value differential, the union
# suite, limit mode, the structural sweep gate, and the materialized-value
# (element-access) differential. Any divergence fails the run — so a corelib bump
# (or a Crucible change) that reintroduces a resolved finding is caught the moment
# it lands. Runs in the prebuilt toolchain image (see image.yml); the per-driver
# timeout keeps a hanging driver from wedging the job (it is reported as a finding
# instead).
#
# Corelibs track `main` on purpose: this is a conformance fuzzer, so a red gate on
# an upstream regression is exactly the signal we want. On a PR from a family branch
# (`GITHUB_HEAD_REF`, e.g. poc/omit-all-default-sequences) bootstrap tracks the
# same-named branch of each corelib and the generator instead — a family-wide change
# is only meaningful compared against itself. Open findings
# (F-0004, F-0012) diverge by design and are kept OUT of these green corpora — they
# live in findings/ until fixed, as do the reproducers that trip the open
# INVALID-vs-INCOMPLETE precedence hole (documentation#15). See
# corpus/regression/README.md for what is admitted and why.
name: replay

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  catalog:
    # Fast, dependency-free gate. Since 2026-08-16 results/FINDINGS.md is GENERATED from
    # the write-ups (scripts/gen-findings.py), so the two can no longer disagree about a
    # state, a pairing or a ticket — only be out of date. The check regenerates and
    # compares, asserts every write-up declares a state, and asserts every closed finding
    # names the gate that re-checks it. Runs before the heavy differential job because
    # none of it needs a driver — and because being careful is not a fix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Catalog consistency
        run: python3 scripts/check-catalog.py

      # Same job on purpose: it needs no drivers and no corpora, so it costs seconds
      # and reports before anything is built. It asserts that every roster entry
      # DECLARES what the gates need to place it — the state that hid `go` outside the
      # encode gate for eleven days was a missing declaration nobody could see.
      - name: Driver participation ledger
        run: ./scripts/driver-audit.sh

  differential:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sofa-buffers/crucible-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap (corelibs + sofabgen @ the branch under test)
        env:
          # actions:read on sofa-buffers/generator so bootstrap can pull the latest green
          # sofabgen CI build. The repo-scoped GITHUB_TOKEN cannot read another repo's
          # artifacts, so create a PAT secret SOFABGEN_TOKEN. Without it, bootstrap falls
          # back — loudly — to the latest tagged release (the run still bootstraps).
          SOFABGEN_TOKEN: ${{ secrets.SOFABGEN_TOKEN }}
        run: ./scripts/bootstrap.sh   # latest green sofabgen CI build (else release) + corelibs, both @ FAMILY_BRANCH

      - name: Differential over seeds (the green gate)
        run: ./scripts/run.sh

      # Reproducers for findings that are already fixed: a divergence here means a
      # resolved bug came back. See corpus/regression/README.md.
      - name: Differential over the resolved-findings regression corpus
        run: CORPUS=corpus/regression ./scripts/run.sh

      # §2/§3 canonicality conformance seeds (WP-08, POC omit-all-default-sequences):
      # an all-default sequence field is OMITTED — an empty frame is accepted and
      # normalized away, the all-default message re-encodes to zero bytes (§2) — and a
      # non-canonical trailing-default array run is accepted + re-encoded canonically
      # (§3 / the F-0010 trim rule). See corpus/conformance/README.md.
      - name: Differential over the §2/§3 canonicality conformance seeds
        run: CORPUS=corpus/conformance ./scripts/run.sh

      - name: Cross-encode over structured values
        run: REGEN=0 ./scripts/cross-encode.sh

      # The union schema — the one wire feature schema/probe.sofab.yaml lacks.
      - name: Union suite (probe-union schema)
        run: ./scripts/run-union.sh

      - name: Limit mode (receiver-side caps)
        run: ./scripts/run-limits.sh

      # Structural sweeps: a normative rule enumerated across EVERY schema position,
      # checked for agreement AND conformance. **All twelve probe axes block** — the last
      # three (framing/ceilings, unknown-sequence, repeated-element-id) were promoted
      # 2026-08-02 when corelib-c-cpp#126, generator#268 and generator#273 landed; only the
      # union pass inside sweep.sh is still report-only. sweep.sh rebuilds vs probe, so it is
      # safe here after limit mode (which leaves probe-dyn binaries).
      - name: Structural sweep gate (all twelve probe axes blocking)
        run: ./scripts/sweep.sh

      # Element-access oracle (oracle/materialized.md): every driver dumps the DECODED
      # value (all fields + array elements explicit, floats as raw bits) under
      # SOFAB_MATERIALIZE=1, catching a decode that differs only where the sparse
      # round-trip wire elides. Checks agreement (all 12) AND conformance (the C anchor
      # vs the reference). 75×12 → 0 divergences. Rebuilds vs probe, safe after limit mode.
      - name: Materialized-value differential (element-access oracle)
        run: ./scripts/materialize.sh

      # The two STREAMING axes (crucible#132). Both are intra-driver invariants — a
      # driver against itself — so unlike every gate above they need no second
      # implementation and drivers opt in one at a time via SOFAB_SPLIT_DRIVERS /
      # SOFAB_ENCODE_DRIVERS. Both are wired here BEFORE any driver implements them,
      # deliberately: they skip loudly (exit 0 with a message) while the roster is
      # empty, so landing the first driver turns the gate on with no CI edit, and the
      # gate can never pass vacuously in the meantime. A driver that ignored the
      # variables would emit byte-identical output, which is indistinguishable from
      # passing — which is exactly why the opt-in roster exists rather than inference.
      - name: Chunk invariance (streaming decode, opt-in roster)
        run: ./scripts/run-chunked.sh

      - name: Encode invariance (streaming encode, opt-in roster)
        run: ./scripts/run-encode.sh
