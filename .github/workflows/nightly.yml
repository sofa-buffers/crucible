# Long, non-blocking, continuous fuzzing — grows the corpus and surfaces NEW
# divergences (what a human otherwise does by hand).
#
# The C pacemaker (libFuzzer + the structure-aware mutator, engine/mutator) grows
# corpus/interesting; that grown corpus is then replayed through the whole roster
# (drivers/roster — the one place it is listed) and
# auto-clustered by root cause. Crashes, the new interesting corpus, and the cluster
# inventory are uploaded as artifacts for a human to triage (F-0006/7/8/9 workflow).
# The corpus is cached between runs so coverage compounds night over night.
#
# Non-blocking by design: a fresh divergence is expected signal, not a build break —
# triage stays human (the corelibs are other repos; cross-repo auto-filing is a
# later step).
name: nightly

on:
  schedule:
    - cron: '42 2 * * *'  # 02:42 UTC daily — deliberately off the top of the hour,
                          # which is the most congested slot in GitHub's shared
                          # schedule queue. The trigger time is a request, not a
                          # promise: this job has been dispatched anywhere from
                          # +0.5 h to +11 h late on an unchanged cron.
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: 'Pacemaker wall-clock budget (seconds)'
        default: '1800'

permissions:
  contents: read
  packages: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/sofa-buffers/crucible-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap (corelibs + sofabgen @ the branch under test)
        env:
          # actions:read on sofa-buffers/generator so bootstrap can pull the latest green
          # sofabgen CI build. The repo-scoped GITHUB_TOKEN cannot read another repo's
          # artifacts, so create a PAT secret SOFABGEN_TOKEN. Without it, bootstrap falls
          # back — loudly — to the latest tagged release (the run still bootstraps).
          SOFABGEN_TOKEN: ${{ secrets.SOFABGEN_TOKEN }}
        # The schedule fires on the default branch, so a nightly is always the `main`
        # family; a workflow_dispatch from a family branch fuzzes that branch instead.
        run: ./scripts/bootstrap.sh   # latest green sofabgen CI build (else release) + corelibs, both @ FAMILY_BRANCH

      # Restore the accumulated coverage corpus (compounds across nights).
      - name: Restore interesting corpus
        uses: actions/cache@v6
        with:
          path: corpus/interesting
          key: crucible-corpus-${{ github.run_id }}
          restore-keys: crucible-corpus-

      # The union engine's own corpus. Its key deliberately does NOT begin with
      # `crucible-corpus-`: the step above restores by that prefix, and a union cache would
      # match it and land union-shaped bytes in the probe corpus.
      - name: Restore interesting corpus (union)
        uses: actions/cache@v6
        with:
          path: |
            corpus/interesting-union
            corpus/stream-union
          key: crucible-unioncorpus-${{ github.run_id }}
          restore-keys: crucible-unioncorpus-

      - name: Fuzz — grow the corpus (C pacemaker + structure-aware mutator)
        run: FUZZ_TIME=${{ github.event.inputs.fuzz_time || '1800' }} ./scripts/fuzz.sh

      # Second steering engine (docs/TODO.md "Multi-impl coverage"). The C pacemaker
      # only explores paths that are complex in C; this steers on corelib-go's own
      # decoder and feeds its discoveries into the same corpus. Given a quarter of the
      # C budget because it is the newer engine, not the lesser one — its first run
      # produced two divergence classes the C-grown corpus never reached.
      # Non-blocking: a Go panic here is a crash finding, reported via the artifact
      # upload below, and must not fail the nightly.
      - name: Fuzz — Go coverage engine (second steering engine)
        id: go_engine
        continue-on-error: true
        run: FUZZ_TIME=$(( ${{ github.event.inputs.fuzz_time || '1800' }} / 4 )) ./scripts/fuzz-go.sh

      # Streaming engines (crucible#178). Nothing above ever exercises feed/finish
      # — every fuzz front-end above calls the one-shot decode, so the streaming
      # path is only ever REPLAYED, over a corpus the block path grew. These steer
      # on the same two engines' chunk-invariance check instead of on coverage
      # over a crash, so a divergence they find is a value/verdict mismatch, not
      # a memory fault (see drivers/c/driver.c's CRUCIBLE_FUZZ_STREAM front-end and
      # drivers/go/fuzz_test.go's FuzzProbeStream). A quarter of the block-path
      # engine's own budget each, same as the Go engine above; non-blocking for
      # the same reason: a violation here is a crash finding, reported via the
      # artifact upload below, and must not fail the nightly.
      - name: Fuzz — C streaming engine (feed/finish path)
        id: c_stream
        continue-on-error: true
        run: FUZZ_STREAM=1 FUZZ_TIME=$(( ${{ github.event.inputs.fuzz_time || '1800' }} / 4 )) ./scripts/fuzz.sh

      - name: Fuzz — Go streaming engine (feed/finish path)
        id: go_stream
        continue-on-error: true
        run: FUZZ_TARGET=FuzzProbeStream FUZZ_TIME=$(( ${{ github.event.inputs.fuzz_time || '1800' }} / 4 )) ./scripts/fuzz-go.sh

      # Union engine. Every engine above fuzzes schema/probe.sofab.yaml, which has NO union,
      # so the union code of every backend was only ever hit by hand-written vectors and
      # sweeps. This steers the same C pacemaker on schema/probe-union-deep.sofab.yaml (struct,
      # array and nested options, a struct default_id, an array of unions, a union in a
      # struct), seeded from corpus/union-deep, into its OWN corpus -- those bytes are shaped
      # for that schema and would only be noise to the probe roster. Block path only.
      # Non-blocking, like every engine here.
      - name: Fuzz — union engine (deep union schema)
        id: union_engine
        continue-on-error: true
        run: |
          FUZZ_SCHEMA=schema/probe-union-deep.sofab.yaml FUZZ_CORPUS=corpus/interesting-union \
          FUZZ_SEEDS=corpus/union-deep \
          FUZZ_TIME=$(( ${{ github.event.inputs.fuzz_time || '1800' }} / 4 )) ./scripts/fuzz.sh

      # The same union schema through the STREAMING target (feed/finish with a chunk or split
      # header): the decode path a real consumer uses, and the one a union's option switch
      # most plausibly breaks across a chunk boundary. The Go engines run on the union
      # schema in their own steps below. Harvest goes to the union corpus.
      - name: Fuzz — union streaming engine (deep union schema, feed/finish path)
        id: union_stream
        continue-on-error: true
        run: |
          FUZZ_STREAM=1 FUZZ_SCHEMA=schema/probe-union-deep.sofab.yaml \
          FUZZ_CORPUS=corpus/interesting-union FUZZ_STREAM_CORPUS=corpus/stream-union \
          FUZZ_SEEDS=corpus/union-deep \
          FUZZ_TIME=$(( ${{ github.event.inputs.fuzz_time || '1800' }} / 4 )) ./scripts/fuzz.sh

      # The Go engines on the union schema (scripts/fuzz-go.sh FUZZ_SCHEMA): steered by corelib-go's
      # OWN decoder coverage, which the C pacemaker above never is, into the same union corpus. The
      # streaming target checks chunk invariance on union decode (a re-encode that differs between
      # one-shot and chunked decode is a failure, not a crash). Each schema has its own GOCACHE,
      # because Go's fuzz cache is harvested whole. Non-blocking, like every engine here.
      - name: Fuzz — union Go engine (deep union schema, block path)
        id: union_go
        continue-on-error: true
        run: |
          FUZZ_SCHEMA=schema/probe-union-deep.sofab.yaml CORPUS=corpus/interesting-union \
          FUZZ_SEEDS=corpus/union-deep \
          FUZZ_TIME=$(( ${{ github.event.inputs.fuzz_time || '1800' }} / 4 )) ./scripts/fuzz-go.sh

      - name: Fuzz — union Go streaming engine (deep union schema, feed/finish path)
        id: union_go_stream
        continue-on-error: true
        run: |
          FUZZ_TARGET=FuzzProbeStream FUZZ_SCHEMA=schema/probe-union-deep.sofab.yaml \
          CORPUS=corpus/interesting-union FUZZ_SEEDS=corpus/union-deep \
          FUZZ_TIME=$(( ${{ github.event.inputs.fuzz_time || '1800' }} / 4 )) ./scripts/fuzz-go.sh

      # Clusters the grown corpus and diffs every camp against results/known-clusters.txt.
      # A camp is in that file only once it is EXPLAINED (a catalogued finding, a legal
      # divergence, a benign soft axis), so anything else turns this step red — in an
      # otherwise green run — and names itself in the log.
      #
      # This replaces "cluster, upload, hope someone looks". The step has clustered and
      # uploaded since it was written; nobody read the artifact, and nine unexplained
      # camps accumulated unnoticed until 2026-08-03. continue-on-error keeps it
      # non-blocking, as before — the change is that silence now means something.
      # TIMEOUT=30, not 5: at 5s this step reported one to three phantom TIMEOUT camps
      # per run over a ~18k-input corpus, on different inputs every time — sporadic
      # scheduling stalls, not hangs (the same inputs replay in under a second, and the
      # camps vanish entirely at 30s). 30 is the floor the tools themselves document
      # (scripts/run.sh: max(30, 0.25 x corpus size)); undercutting it 6x made this step
      # red for no reason, which is exactly what known-clusters.txt exists to prevent.
      # A real hang still fails it — 30s per input is a hang by any measure.
      - name: Cluster new divergences (non-blocking; red on an unexplained camp)
        id: cluster
        continue-on-error: true
        run: |
          CLUSTER=1 TIMEOUT=30 CORPUS=corpus/interesting BASELINE=results/known-clusters.txt \
            ./scripts/run.sh

      # The union corpus is clustered against ITS roster build (the deep schema) and its own
      # baseline. Run after the probe cluster step: it rebuilds every driver against the
      # union schema and leaves them that way, which nothing after it depends on.
      - name: Cluster union divergences (non-blocking; red on an unexplained camp)
        id: cluster_union
        continue-on-error: true
        run: |
          SCHEMA=schema/probe-union-deep.sofab.yaml CLUSTER=1 TIMEOUT=30 \
          CORPUS=corpus/interesting-union BASELINE=results/known-clusters-union.txt \
            ./scripts/run.sh

      - name: Upload findings artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}
          path: |
            corpus/crashes/
            corpus/interesting/
            corpus/interesting-union/
            results/CLUSTERS.md
          if-no-files-found: ignore
          retention-days: 14

      # The non-blocking steps above keep the job going — a Go panic is a finding to upload, not
      # a reason to stop — but a step that stops working then says nothing: the Go engines
      # (2026-08, 2026-10-01) and both cluster steps (2026-10-05…07, a driver that no longer
      # compiled) each went dark for days on a green run. Their real outcome is only in
      # `steps.<id>.outcome`, so every one of them carries an `id` (enforced by
      # `check-nightly-steps.py --lint` in replay.yml's catalog job), and this step turns any
      # failure among them into an annotation, a summary line, and a red run. It runs after the
      # upload, so the artifact is never lost to it.
      - name: Non-blocking step outcomes (red when any of them failed)
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/check-nightly-steps.py
