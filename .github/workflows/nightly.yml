# Long, non-blocking, continuous fuzzing — grows the corpus and surfaces NEW
# divergences (what a human otherwise does by hand).
#
# The C pacemaker (libFuzzer + the structure-aware mutator, engine/mutator) grows
# corpus/interesting; that grown corpus is then replayed through the whole roster
# (drivers/roster — the one place it is listed) and
# auto-clustered by root cause. Crashes, the new interesting corpus, and the cluster
# inventory are uploaded as artifacts for a human to triage (F-0006/7/8/9 workflow).
# The corpus is cached between runs so coverage compounds night over night.
#
# Non-blocking by design: a fresh divergence is expected signal, not a build break —
# triage stays human (the corelibs are other repos; cross-repo auto-filing is a
# later step).
name: nightly

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: 'Pacemaker wall-clock budget (seconds)'
        default: '1800'

permissions:
  contents: read
  packages: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/sofa-buffers/crucible-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap (corelibs + sofabgen @ the branch under test)
        env:
          # actions:read on sofa-buffers/generator so bootstrap can pull the latest green
          # sofabgen CI build. The repo-scoped GITHUB_TOKEN cannot read another repo's
          # artifacts, so create a PAT secret SOFABGEN_TOKEN. Without it, bootstrap falls
          # back — loudly — to the latest tagged release (the run still bootstraps).
          SOFABGEN_TOKEN: ${{ secrets.SOFABGEN_TOKEN }}
        # The schedule fires on the default branch, so a nightly is always the `main`
        # family; a workflow_dispatch from a family branch fuzzes that branch instead.
        run: ./scripts/bootstrap.sh   # latest green sofabgen CI build (else release) + corelibs, both @ FAMILY_BRANCH

      # Restore the accumulated coverage corpus (compounds across nights).
      - name: Restore interesting corpus
        uses: actions/cache@v6
        with:
          path: corpus/interesting
          key: crucible-corpus-${{ github.run_id }}
          restore-keys: crucible-corpus-

      - name: Fuzz — grow the corpus (C pacemaker + structure-aware mutator)
        run: FUZZ_TIME=${{ github.event.inputs.fuzz_time || '1800' }} ./scripts/fuzz.sh

      # Second steering engine (docs/TODO.md "Multi-impl coverage"). The C pacemaker
      # only explores paths that are complex in C; this steers on corelib-go's own
      # decoder and feeds its discoveries into the same corpus. Given a quarter of the
      # C budget because it is the newer engine, not the lesser one — its first run
      # produced two divergence classes the C-grown corpus never reached.
      # Non-blocking: a Go panic here is a crash finding, reported via the artifact
      # upload below, and must not fail the nightly.
      - name: Fuzz — Go coverage engine (second steering engine)
        continue-on-error: true
        run: FUZZ_TIME=$(( ${{ github.event.inputs.fuzz_time || '1800' }} / 4 )) ./scripts/fuzz-go.sh

      # Clusters the grown corpus and diffs every camp against results/known-clusters.txt.
      # A camp is in that file only once it is EXPLAINED (a catalogued finding, a legal
      # divergence, a benign soft axis), so anything else turns this step red — in an
      # otherwise green run — and names itself in the log.
      #
      # This replaces "cluster, upload, hope someone looks". The step has clustered and
      # uploaded since it was written; nobody read the artifact, and nine unexplained
      # camps accumulated unnoticed until 2026-08-03. continue-on-error keeps it
      # non-blocking, as before — the change is that silence now means something.
      # TIMEOUT=30, not 5: at 5s this step reported one to three phantom TIMEOUT camps
      # per run over a ~18k-input corpus, on different inputs every time — sporadic
      # scheduling stalls, not hangs (the same inputs replay in under a second, and the
      # camps vanish entirely at 30s). 30 is the floor the tools themselves document
      # (scripts/run.sh: max(30, 0.25 x corpus size)); undercutting it 6x made this step
      # red for no reason, which is exactly what known-clusters.txt exists to prevent.
      # A real hang still fails it — 30s per input is a hang by any measure.
      - name: Cluster new divergences (non-blocking; red on an unexplained camp)
        continue-on-error: true
        run: |
          CLUSTER=1 TIMEOUT=30 CORPUS=corpus/interesting BASELINE=results/known-clusters.txt \
            ./scripts/run.sh

      - name: Upload findings artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}
          path: |
            corpus/crashes/
            corpus/interesting/
            results/CLUSTERS.md
          if-no-files-found: ignore
          retention-days: 14
